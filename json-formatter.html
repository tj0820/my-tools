    .site-nav a:hover, .site-nav a.active { color: #fff; background: rgba(255,255,255,0.15); }

<body>
  <div class="container">
    <nav class="site-nav">

    <div class="header">
      <h1>JSON 格式化工具</h1>
      <p>JSON 美化缩进、压缩、语法校验、转义与反转义</p>
    </div>

    <div class="indent-row">
      <label>缩进：</label>
      <select class="indent-select" id="indentSelect">
        <option value="2">2 空格</option>
        <option value="4" selected>4 空格</option>
        <option value="tab">Tab</option>
      </select>
    </div>

    <div class="toolbar">
      <button class="btn-format" onclick="formatJSON()">美化格式</button>
      <button class="btn-minify" onclick="minifyJSON()">压缩</button>
      <button class="btn-validate" onclick="validateJSON()">校验</button>
      <button class="btn-escape" onclick="escapeJSON()">转义</button>
      <button class="btn-unescape" onclick="unescapeJSON()">反转义</button>
      <button class="btn-sample" onclick="loadSample()">示例</button>
      <button class="btn-clear" onclick="clearAll()">清空</button>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-header">
          <span>输入</span>
          <span class="badge" id="inputBadge">等待输入</span>
        </div>
        <textarea id="jsonInput" placeholder='在此粘贴 JSON 数据...'></textarea>
        <div class="info-bar">
          <span id="inputInfo">0 字符</span>
          <span>输入区域</span>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <span>输出</span>
          <span class="badge" id="outputBadge">等待处理</span>
        </div>
        <textarea id="jsonOutput" placeholder="处理结果将显示在这里..." readonly></textarea>
        <div class="info-bar">
          <span id="outputInfo">0 字符</span>
          <span>输出区域</span>
        </div>
      </div>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <footer class="site-footer">
      <a href="index.html">首页</a> |
      <a href="qr-generator.html">二维码</a> |
      <a href="json-formatter.html">JSON</a> |
      <a href="word-counter.html">字数统计</a> |
      <a href="password-generator.html">密码</a> |
      <a href="base64-tool.html">Base64</a>
      <p style="margin-top:8px">纯浏览器端处理 · 数据不会上传到服务器 · 安全私密</p>
    </footer>
  </div>

  <script>
    var jsonInput = document.getElementById('jsonInput');
    var jsonOutput = document.getElementById('jsonOutput');

    jsonInput.addEventListener('input', function() {
      document.getElementById('inputInfo').textContent = this.value.length + ' 字符';
    });

    function getIndent() {
      var v = document.getElementById('indentSelect').value;
      return v === 'tab' ? '\t' : parseInt(v);
    }

    function showStatus(msg, type) {
      var bar = document.getElementById('statusBar');
      bar.textContent = msg;
      bar.className = 'status-bar ' + type;
    }

    function hideStatus() {
      document.getElementById('statusBar').className = 'status-bar';
    }

    function formatJSON() {
      var input = jsonInput.value.trim();
      if (!input) { showStatus('请输入 JSON 数据', 'error'); return; }
      try {
        var obj = JSON.parse(input);
        var result = JSON.stringify(obj, null, getIndent());
        jsonOutput.value = result;
        document.getElementById('outputInfo').textContent = result.length + ' 字符';
        setBadge('inputBadge', '原始 JSON');
        setBadge('outputBadge', '已美化');
        showStatus('格式化成功', 'success');
      } catch (e) {
        jsonOutput.value = '';
        setBadge('outputBadge', '格式错误');
        showStatus('JSON 语法错误：' + e.message, 'error');
      }
    }

    function minifyJSON() {
      var input = jsonInput.value.trim();
      if (!input) { showStatus('请输入 JSON 数据', 'error'); return; }
      try {
        var obj = JSON.parse(input);
        var result = JSON.stringify(obj);
        jsonOutput.value = result;
        document.getElementById('outputInfo').textContent = result.length + ' 字符';
        setBadge('inputBadge', '原始 JSON');
        setBadge('outputBadge', '已压缩');
        showStatus('压缩成功，减少 ' + (input.length - result.length) + ' 个字符', 'success');
      } catch (e) {
        jsonOutput.value = '';
        setBadge('outputBadge', '格式错误');
        showStatus('JSON 语法错误：' + e.message, 'error');
      }
    }

    function validateJSON() {
      var input = jsonInput.value.trim();
      if (!input) { showStatus('请输入 JSON 数据', 'error'); return; }
      try {
        JSON.parse(input);
        setBadge('outputBadge', '合法 JSON');
        showStatus('JSON 语法校验通过', 'success');
        jsonOutput.value = '';
      } catch (e) {
        setBadge('outputBadge', '非法 JSON');
        showStatus('JSON 语法错误：' + e.message, 'error');
        jsonOutput.value = '';
      }
    }

    function escapeJSON() {
      var input = jsonInput.value;
      if (!input) { showStatus('请输入数据', 'error'); return; }
      var result = JSON.stringify(input);
      jsonOutput.value = result;
      document.getElementById('outputInfo').textContent = result.length + ' 字符';
      setBadge('outputBadge', '已转义');
      showStatus('转义成功', 'success');
    }

    function unescapeJSON() {
      var input = jsonInput.value.trim();
      if (!input) { showStatus('请输入数据', 'error'); return; }
      try {
        var result = JSON.parse(input);
        if (typeof result !== 'string') throw new Error('输入必须是转义后的字符串');
        jsonOutput.value = result;
        document.getElementById('outputInfo').textContent = result.length + ' 字符';
        setBadge('outputBadge', '已反转义');
        showStatus('反转义成功', 'success');
      } catch (e) {
        jsonOutput.value = '';
        setBadge('outputBadge', '反转义失败');
        showStatus('反转义失败：' + e.message, 'error');
      }
    }

    function clearAll() {
      jsonInput.value = '';
      jsonOutput.value = '';
      document.getElementById('inputInfo').textContent = '0 字符';
      document.getElementById('outputInfo').textContent = '0 字符';
      setBadge('inputBadge', '等待输入');
      setBadge('outputBadge', '等待处理');
      hideStatus();
    }

    function loadSample() {
      jsonInput.value = '{"name":"在线工具集","version":"1.0","tools":[{"id":1,"name":"JSON格式化","free":true},{"id":2,"name":"二维码生成","free":true}],"settings":{"theme":"dark","language":"zh-CN"}}';
      document.getElementById('inputInfo').textContent = jsonInput.value.length + ' 字符';
      setBadge('inputBadge', '已加载示例');
      hideStatus();
    }

    function setBadge(id, text) {
      document.getElementById(id).textContent = text;
    }
  </script>
